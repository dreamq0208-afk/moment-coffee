<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>此刻咖啡馆</title>
<link rel="stylesheet" href="/src/paper.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .44  0 0 0 0 .42  0 0 0 .13 0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>

<div id="app">
<button class="iconbtn cabinet-shortcut" id="toCabinet" aria-label="我的咖啡柜"><svg viewBox="0 0 24 24" class="ln-thin"><path d="M4 3H20V21H4Z"/><path d="M4 9H20M4 15H20"/><path d="M8 7V5M11 7V6M15 13V11M9 19V17"/></svg></button>

<!-- 1 开屏 -->
<section class="screen on" id="s-start" aria-label="开屏">
  <div class="topbar" aria-hidden="true"></div>
  <button class="start-cup" id="startCup" aria-label="此刻咖啡馆的杯子"><svg id="openGlass" viewBox="0 0 220 280" width="190" height="240"></svg></button>
  <h1 class="slogan hand">把此刻，<br>调成一杯咖啡。</h1>
  <p class="lead">说说你的电量，加几种情绪进去。<br>咖啡师会给你做一杯刚刚好的。</p>
  <div class="steps" aria-label="三步">
    <div class="step"><svg viewBox="0 0 34 34" class="ln-thin"><rect x="4" y="11" width="23" height="12" rx="2"/><path d="M29 15V19"/><rect x="7" y="14" width="5" height="6" class="inkfill" stroke="none"/><rect x="13" y="14" width="5" height="6" class="inkfill" stroke="none"/></svg>看看电量</div>
    <span class="step-arrow" aria-hidden="true">›</span>
    <div class="step"><svg viewBox="0 0 34 34" class="ln-thin"><path d="M11 6H23V9H11Z" class="inkfill"/><path d="M10 11Q9 12 9 15V27Q9 30 12 30H22Q25 30 25 27V15Q25 12 24 11Z"/><circle cx="14.5" cy="17" r=".8" class="inkfill"/><circle cx="19.5" cy="17" r=".8" class="inkfill"/><path d="M15 20Q17 22 19 20"/></svg>放进心情</div>
    <span class="step-arrow" aria-hidden="true">›</span>
    <div class="step"><svg viewBox="0 0 34 34" class="ln-thin"><path d="M9 9L11 30H23L25 9"/><path d="M9 9H25"/><path d="M14 4Q13 6 14 7M18 3Q17 5 18 7M22 4Q21 6 22 7"/></svg>领一杯此刻</div>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
    <button class="btn solid" id="goMix">开始调一杯</button>
    <button class="link" id="goRandom" style="align-self:center">今天随便来一杯</button>
  </div>
</section>

<!-- 2 调配页 -->
<section class="screen" id="s-mix" aria-label="调配页">
  <div class="topbar">
    <button class="iconbtn" data-back="s-start" aria-label="返回"><svg viewBox="0 0 24 24" class="ln-thin"><path d="M15 5L8 12L15 19"/></svg></button>
    <span></span>
  </div>
  <h1 class="mix-title hand">往杯子里放点此刻</h1>
  <p class="mix-sub muted">先点电量，再点罐子。点一下加一点，再点一下多一点。</p>
  <div class="battery">
    <div class="bat" role="radiogroup" aria-label="电量" id="bat"></div>
    <span class="bat-label" id="batLabel"></span>
  </div>
  <div class="mix-stage">
    <svg class="mix-cup" id="mixGlass" viewBox="0 0 220 280" role="img" aria-label="正在调的这杯"></svg>
    <div class="tags" id="tags" aria-label="杯里的每一层"></div>
  </div>
  <div class="jars" id="jars"></div>
  <p class="status muted" id="status" aria-live="polite"></p>
  <div class="mix-foot">
    <div style="display:flex">
      <button class="iconbtn" id="undo" aria-label="撤回一步"><svg viewBox="0 0 24 24" class="ln-thin"><path d="M9 7L4 12L9 17"/><path d="M4 12H14Q20 12 20 18"/></svg></button>
      <button class="iconbtn" id="dump" aria-label="倒掉重来"><svg viewBox="0 0 24 24" class="ln-thin"><path d="M5 6L17 9L14 20L4 17Z"/><path d="M17 11Q21 13 20 18"/><circle cx="20" cy="21" r=".8" class="inkfill"/></svg></button>
    </div>
    <button class="bell" id="bell" aria-label="摇铃，交给咖啡师">
      <span class="bell-hint" id="bellHint"></span>
      <svg viewBox="0 0 60 46" id="bellSvg"><path class="ln" d="M12 36Q12 16 30 16Q48 16 48 36Z"/><path class="inkfill" d="M6 36H54V40H6Z"/><path class="inkfill" d="M27 11H33V16H27Z"/><path class="ln-thin" d="M20 28Q21 22 26 20"/></svg>
    </button>
  </div>
</section>

<!-- 3 等待页 -->
<section class="screen" id="s-wait" aria-label="等待页">
  <svg class="wait-cup" id="waitGlass" viewBox="0 0 220 280" role="img" aria-label="咖啡调配回放"></svg>
  <h1 class="wait-title hand">咖啡师在做了</h1>
  <input class="field" id="msg" maxlength="30" placeholder="描绘此刻，注入杯中（可不填）" aria-label="描绘此刻，注入杯中" autocomplete="off">
  <p class="count muted"><span id="msgCount">0</span>/30</p>
  <div class="wait-examples" aria-label="试着说一句">
    <span class="muted">不知道说什么？试一句</span>
    <button type="button" data-example="今天有点累，想慢一点">今天有点累</button>
    <button type="button" data-example="有件小事，想和你分享">有件小事</button>
    <button type="button" data-example="今天有点想念一个人">想念一个人</button>
  </div>
  <div class="row" style="margin-top:auto">
    <button class="btn" id="skipMsg">直接做</button>
    <button class="btn solid" id="sendMsg" disabled>加好啦</button>
  </div>
</section>

<!-- 4 揭晓页 -->
<section class="screen" id="s-reveal" aria-label="揭晓页">
  <div class="hidden-flag" id="hiddenFlag"><span class="sticker" style="background:var(--gold)"><svg viewBox="0 0 18 18" width="16" height="16"><path d="M9 2Q10 8 16 9Q10 10 9 16Q8 10 2 9Q8 8 9 2Z" fill="#1C1B1A"/></svg></span>隐藏款 · 今天归你</div>
  <div class="stage" id="stage">
    <svg class="bar-line" viewBox="0 0 400 24" preserveAspectRatio="none" aria-hidden="true"><path class="ln" filter="url(#wob)" d="M-4 8Q100 10 200 7T404 8"/><path class="ln-thin" d="M-4 16Q120 17 240 15T404 16" opacity=".5"/></svg>
    <div class="stage-vessel" id="stageVessel"></div>
    <div class="stage-note" id="stageNote"><span class="stage-tape" aria-hidden="true"></span><p class="hand" id="stageNoteText">这一页，先留白</p></div>
    <div class="confetti" id="confetti"></div>
  </div>
  <div class="reveal-name-row">
    <h1 class="cup-name hand pending" id="cupName">这一杯，正在落款…</h1>
    <button class="bean-trigger" id="beanTrigger" type="button" aria-label="打开这杯的故事" aria-haspopup="dialog" aria-controls="recipeOverlay" aria-expanded="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M21 4C10 4 5 14 7 24c2 10 10 15 19 13 9-2 13-10 10-20C34 8 28 4 21 4Z"/><path d="M27 8c-1 5-8 6-10 12-2 5 0 9-3 13"/></svg></button>
  </div>
  <p class="cup-date muted latin" id="cupDate"></p>
  <p class="care" id="care" hidden>如果你正在经历很难熬的时刻，可以联系身边信任的人，或者当地的心理援助热线。</p>
  <div class="row" style="margin-top:auto;padding-top:16px">
    <button class="btn" id="again">再调一杯</button>
    <button class="btn solid" id="takeAway">带走这杯</button>
  </div>
</section>

<div class="recipe-overlay" id="recipeOverlay" role="dialog" aria-modal="true" aria-label="这杯的故事" hidden>
  <div class="recipe-backdrop" id="recipeBackdrop"></div>
  <div class="story-card" id="storyCard" role="button" tabindex="0" aria-label="收起这杯的故事">
    <p class="story-words hand" id="storyWords">这一杯的话，还在路上…</p>
    <div class="story-rule" aria-hidden="true"><span></span></div>
    <dl class="story-facts">
      <div><dt>做法</dt><dd id="storyMethod"></dd></div>
      <div><dt>豆子</dt><dd id="storyBean"></dd></div>
      <div><dt>风味</dt><dd id="storyFlavor"></dd></div>
      <div><dt>心情</dt><dd id="storyEmotions"></dd></div>
      <div><dt>电量</dt><dd id="storyBattery"></dd></div>
    </dl>
    <p class="story-close">轻点卡片，回到这一杯 ↶</p>
  </div>
</div>

<!-- 5 分享页 -->
<section class="screen" id="s-share" aria-label="分享页">
  <div class="topbar">
    <button class="iconbtn" data-back="s-reveal" aria-label="返回"><svg viewBox="0 0 24 24" class="ln-thin"><path d="M15 5L8 12L15 19"/></svg></button>
    <span style="font-size:14px;font-weight:400">挑一种样子带走</span>
    <span style="width:44px"></span>
  </div>
  <div class="tabs" role="tablist" id="styleTabs">
    <button role="tab" data-style="receipt" aria-selected="true">小票</button>
    <button role="tab" data-style="polaroid" aria-selected="false">拍立得</button>
    <button role="tab" data-style="journal" aria-selected="false">手帐</button>
    <button role="tab" data-style="label" aria-selected="false">杯标签</button>
  </div>
  <div class="card-wrap" id="cardWrap"></div>
  <div class="row" style="margin-top:auto">
    <button class="btn" id="saveImg">保存图片</button>
    <button class="btn solid" id="toShelf">收进咖啡柜</button>
  </div>
</section>

<!-- 6 咖啡柜 -->
<section class="screen" id="s-cabinet" aria-label="咖啡柜">
  <div class="topbar">
    <button class="iconbtn" id="cabBack" aria-label="返回"><svg viewBox="0 0 24 24" class="ln-thin"><path d="M15 5L8 12L15 19"/></svg></button>
    <span></span>
  </div>
  <h1 class="cab-title hand">我的咖啡柜</h1>
  <p class="muted" style="font-size:13px;margin:0">每一杯都收在这里，按月摆好</p>
  <div class="months" role="tablist" id="months"></div>
  <div id="shelfWrap"></div>
  <button class="btn solid" id="cabAgain" style="margin-top:auto">再调一杯</button>
</section>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="/src/paper.js"></script>
</body>
</html>
